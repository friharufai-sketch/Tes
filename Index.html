
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Catcher Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(#87ceeb, #e0f7fa);
    text-align: center;
    overflow: hidden;
}

h2 {
    color: #333;
    margin: 12px;
}

#info {
    display: flex;
    justify-content: space-around;
    font-size: 18px;
    font-weight: bold;
    padding: 10px;
}

#game {
    position: relative;
    width: 100%;
    max-width: 500px;
    height: 75vh;
    min-height: 350px;
    margin: auto;
    background: linear-gradient(#b3e5fc, #e1f5fe);
    border: 4px solid white;
    border-radius: 15px;
    overflow: hidden;
}

#player {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 65px;
    width: 75px;
    text-align: center;
}

.food {
    position: absolute;
    top: -50px;
    font-size: 35px;
}

#controls {
    margin: 15px;
}

button {
    padding: 14px 30px;
    margin: 5px;
    border: none;
    border-radius: 12px;
    background: #ff9800;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

button:active {
    background: #e65100;
}

#startScreen {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

#startScreen button {
    background: #4caf50;
}

</style>
</head>

<body>

<h2>🍔 FOOD CATCHER 🍕</h2>

<div id="info">
    <span>⭐ Skor: <span id="score">0</span></span>
    <span>❤️ Nyawa: <span id="lives">3</span></span>
</div>

<div id="game">

    <div id="startScreen">
        <h1>🍟 Food Catcher!</h1>
        <p>Tangkap makanan sebanyak mungkin!</p>
        <button onclick="startGame()">MULAI GAME</button>
    </div>

    <div id="player">🧑</div>

</div>

<div id="controls">
    <button id="left">⬅️</button>
    <button id="right">➡️</button>
</div>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const livesText = document.getElementById("lives");
const startScreen = document.getElementById("startScreen");

const foods = ["🍎","🍔","🍕","🍟","🍉","🍌",
               "🍇","🍩","🍪","🥕","🍗","🍓"];

let playerX = 0;
let score = 0;
let lives = 3;
let speed = 3;
let running = false;
let foodList = [];
let spawnTimer;
let animation;

function updatePlayer() {
    const max = game.clientWidth - player.offsetWidth;
    playerX = Math.max(0, Math.min(playerX, max));
    player.style.left = playerX + "px";
    player.style.transform = "none";
}

function move(direction) {
    if (!running) return;
    playerX += direction * 30;
    updatePlayer();
}

document.getElementById("left").addEventListener("pointerdown", e => {
    e.preventDefault();
    move(-1);
});

document.getElementById("right").addEventListener("pointerdown", e => {
    e.preventDefault();
    move(1);
});

document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" || e.key === "a") move(-1);
    if (e.key === "ArrowRight" || e.key === "d") move(1);
});

function createFood() {
    if (!running) return;

    const food = document.createElement("div");
    food.className = "food";
    food.textContent = foods[Math.floor(Math.random() * foods.length)];

    const max = game.clientWidth - 40;
    const x = Math.random() * max;

    food.style.left = x + "px";
    game.appendChild(food);

    foodList.push({
        element: food,
        x: x,
        y: -45
    });
}

function gameLoop() {
    if (!running) return;

    const playerRect = player.getBoundingClientRect();

    foodList.forEach((food, index) => {
        food.y += speed;
        food.element.style.top = food.y + "px";

        const foodRect = food.element.getBoundingClientRect();

        // Makanan tertangkap
        if (
            foodRect.bottom >= playerRect.top + 10 &&
            foodRect.left < playerRect.right &&
            foodRect.right > playerRect.left &&
            foodRect.top < playerRect.bottom
        ) {
            score += 10;
            scoreText.textContent = score;

            food.element.remove();
            foodList.splice(index, 1);

            speed = 3 + Math.floor(score / 100) * 0.5;
            return;
        }

        // Makanan terlewat
        if (food.y > game.clientHeight) {
            lives--;
            livesText.textContent = lives;

            food.element.remove();
            foodList.splice(index, 1);

            if (lives <= 0) {
                endGame();
            }
        }
    });

    animation = requestAnimationFrame(gameLoop);
}

function startGame() {
    score = 0;
    lives = 3;
    speed = 3;
    playerX = (game.clientWidth - player.offsetWidth) / 2;

    scoreText.textContent = score;
    livesText.textContent = lives;

    foodList.forEach(f => f.element.remove());
    foodList = [];

    updatePlayer();

    startScreen.style.display = "none";
    running = true;

    spawnTimer = setInterval(createFood, 900);
    gameLoop();
}

function endGame() {
    running = false;

    clearInterval(spawnTimer);
    cancelAnimationFrame(animation);

    startScreen.style.display = "flex";
    startScreen.innerHTML = `
        <h1>GAME OVER!</h1>
        <h2>⭐ Skor kamu: ${score}</h2>
        <p>Hebat! Coba pecahkan rekor kamu!</p>
        <button onclick="startGame()">MAIN LAGI</button>
    `;
}
</script>

</body>
</html>
